<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صديقي الصغير – تعلّم والعب</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e8f7ff;--card:#fff;--tx:#23304d;--mu:#6a7a99;--a:#ff7a59;--b:#3ec6a8;--c:#6c8cff;--bd:#d3ecfa;--ok:#2fc77a;--no:#ff5c6c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14213d;--card:#1f2f52;--tx:#f2f6ff;--mu:#9fb0d3;--bd:#2e4272}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14213d;--card:#1f2f52;--tx:#f2f6ff;--mu:#9fb0d3;--bd:#2e4272}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100vh;overflow-x:hidden}
.w{max-width:480px;margin:0 auto;padding:16px;text-align:center}
[hidden]{display:none!important}
button{font:inherit;border:0;cursor:pointer;color:inherit}
.card{background:var(--card);border-radius:28px;padding:18px;border:2px solid var(--bd);position:relative}
.stars{font-size:20px;font-weight:800;margin-bottom:6px}
.pet{line-height:1;display:inline-block;animation:bob 2.4s ease-in-out infinite;cursor:pointer;user-select:none;transition:font-size .5s}
@keyframes bob{50%{transform:translateY(-10px) scale(1.04)}}
.pet.jump{animation:jp .7s}
@keyframes jp{30%{transform:translateY(-40px) rotate(-12deg) scale(1.15)}60%{transform:translateY(0) rotate(10deg)}to{transform:none}}
#pn{font-size:20px;font-weight:800;margin:4px 0}
.bar{height:16px;background:var(--bd);border-radius:10px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd23f,#ff7a59);border-radius:10px;transition:width .6s}
small{color:var(--mu)}
.big{display:block;width:100%;padding:18px;border-radius:22px;font-size:22px;font-weight:800;color:#fff;margin-top:14px;box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .1s,box-shadow .1s}
.big:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:8px 14px;font-weight:700}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--bd)}
.dots i.on{background:#ffd23f;transform:scale(1.2)}
#q{font-size:20px;font-weight:700;margin:14px 0 4px}
#pic{font-size:84px;line-height:1.15;min-height:100px;word-break:break-all;animation:pop .4s}
@keyframes pop{from{transform:scale(.3);opacity:0}}
#wd{font-size:30px;font-weight:900;min-height:40px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.opt{background:var(--card);border:3px solid var(--bd);border-radius:22px;font-size:46px;font-weight:900;padding:18px 0;box-shadow:0 6px 0 var(--bd);transition:transform .1s}
.opt:active{transform:translateY(4px)}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok);animation:jp .6s}
.opt.no{background:var(--no);color:#fff;border-color:var(--no);animation:sk .4s;opacity:.55;pointer-events:none}
@keyframes sk{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.fl{position:fixed;font-size:28px;pointer-events:none;z-index:9;animation:fy 1.1s forwards}
@keyframes fy{to{transform:translate(var(--dx),var(--dy)) rotate(360deg) scale(.4);opacity:0}}
.toast{position:fixed;inset:auto 16px 28px;max-width:448px;margin:auto;background:var(--tx);color:var(--bg);padding:16px;border-radius:20px;font-size:20px;font-weight:800;text-align:center;z-index:10;transition:.4s;transform:translateY(160%)}
.toast.s{transform:none}
.ft{color:var(--mu);font-size:12px;margin-top:18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.opt.sm{font-size:24px;padding:26px 4px}
#ac{font-size:46px;height:52px;line-height:52px}
.opt.eq{border-color:#ffd23f;background:#fff6cf;color:#23304d}
details summary{font-weight:800;cursor:pointer}
#pa{margin-top:10px;line-height:1.9;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.cd{aspect-ratio:1;border-radius:18px;font-size:38px;background:var(--c);color:#fff;border:3px solid transparent;box-shadow:0 5px 0 rgba(0,0,0,.18);transition:transform .2s}
.cd.f{background:var(--card);color:inherit;border-color:var(--bd);transform:scale(1.06)}
.cd.m{background:var(--ok);color:#fff;border-color:var(--ok)}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4a9af0">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>

<div class="w" id="home">
<div class="card" id="pick" hidden><div style="font-size:22px;font-weight:800">اختر صديقك 💛</div><div class="opts" id="pk"></div></div>
<div id="main">
  <div class="card">
    <div class="stars" id="st"></div>
    <div id="ac"></div><div class="pet" id="pet"></div>
    <div id="pn"></div>
    <div class="bar"><i id="pb"></i></div>
    <small id="pt"></small>
  </div>
  <button class='big' style='background:linear-gradient(90deg,#ff7a59,#ffb703)' id='gP'>🗺️ خريطة المغامرة</button>
  <button class="big" style="background:var(--a)" id="gL">🔤 العب بالحروف</button>
  <button class="big" style="background:var(--b)" id="gN">🔢 العب بالأرقام</button>
  <button class="big" style="background:var(--c)" id="gC">🎨 تعرّف على الألوان</button>
  <button class="big" style="background:#b86cff" id="gM">➕ جمع وطرح</button>
  <button class="big" style="background:#ff5c93" id="gT">✍️ اكتب الحرف بإصبعك</button>
  <button class="big" style="background:#1fa7c9" id="gG">🧠 لعبة الذاكرة</button>
  <button class="big" style="background:#e0a100" id="gA">🐾 أصوات الحيوانات</button>
  <button class='big' style='background:#7a5cff' id='gY'>📖 قصص تفاعلية</button>
  <div class="card" style="margin-top:16px"><div style="font-weight:800;margin-bottom:8px">🛍️ متجر الزينة (بالعملات)</div><div class="opts" id="sh" style="grid-template-columns:repeat(4,1fr);margin-top:0"></div></div>
  <details class="card" style="margin-top:14px;text-align:right"><summary>👨‍👩‍👧 ركن الأهل</summary><div id="pa"></div></details>
  </div><div class="ft">كل إجابة صحيحة تكسبك نجمة، والنجوم تُكبّر صديقك 💛<br>بدون إعلانات · بدون مشتريات · آمنة للأطفال</div>
</div>

<div class="w" id="game" hidden>
  <div class="top"><button class="back" id="bk">↩ رجوع</button><div class="dots" id="ds"></div></div>
  <div class="card" style="margin-top:14px">
    <div id="q"></div>
    <div id="pic"></div>
    <div id="wd"></div>
  </div>
  <div class="opts" id="op"></div>
</div>

<div class="w" id="mg" hidden><div class="top"><button class="back" id="mb">↩ رجوع</button><b id="mm">ابحث عن الأزواج المتشابهة</b></div><div class="grid" id="mgrid"></div></div>
<div class="w" id="tr" hidden><div class="top"><button class="back" id="tb">↩ رجوع</button><b id="tl"></b></div>
<div class="card" style="margin-top:14px;padding:8px"><div style="position:relative;width:100%;max-width:320px;margin:auto;aspect-ratio:1"><canvas id="cb" width="300" height="300" style="position:absolute;inset:0;width:100%;height:100%"></canvas><canvas id="ci" width="300" height="300" style="position:absolute;inset:0;width:100%;height:100%;touch-action:none"></canvas></div></div>
<div class="top" style="margin-top:6px"><button class="big" style="background:var(--no);margin-top:10px" id="tc">🧽 امسح</button><button class="big" style="background:var(--ok);margin-top:10px" id="td">✔️ تم</button></div></div>
<div class='w' id='mp' hidden><div class='top'><button class='back' id='pb2'>↩ رجوع</button><b>🗺️ خريطة المغامرة</b></div><div id='mn' style='display:flex;flex-direction:column;gap:12px;margin-top:14px'></div></div>
<div class='w' id='sy' hidden><div class='top'><button class='back' id='yb'>↩ رجوع</button><b id='yt'></b></div><div class='card' style='margin-top:14px'><div id='ys' style='font-size:64px;min-height:80px'></div><div id='yx' style='font-size:21px;font-weight:700;line-height:1.7;margin-top:8px'></div></div><div id='yc'></div></div>
<div class="toast" id="ts"></div>

<script>
var W=[["🍎","تفاحة","ت"],["🦆","بطة","ب"],["🐪","جمل","ج"],["🐟","سمكة","س"],["🐱","قطة","ق"],["🦁","أسد","أ"],["🐘","فيل","ف"],["🍌","موزة","م"],["⭐","نجمة","ن"],["🌹","وردة","و"],["🐓","ديك","د"],["🐴","حصان","ح"],["🐶","كلب","ك"],["🍋","ليمون","ل"],["🌙","هلال","ه"]],
FR=["🍎","🍌","🍓","🐟","⭐","🎈","🐥","🌸"],
ST=[[0,"🥚","بيضة صغيرة"],[5,"🐣","كتكوت صغير"],[15,"🐥","فرخ ذكي"],[30,"🦜","ببغاء متكلم"],[50,"🦚","طاووس رائع"]],
D="٠١٢٣٤٥٦٧٨٩",K="kidpet1",S,mode,rd,ok,cur,AC;
function $(i){return document.getElementById(i)}
function load(){try{S=JSON.parse(localStorage.getItem(K))}catch(e){S=null}if(!S||typeof S.s!=="number")S={s:0}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function stg(){var i=0;ST.forEach(function(g,k){if(S.s>=g[0])i=k});return i}
function home(){var i=stg(),g=ST[i],n=ST[i+1];
 $("pet").textContent=g[1];$("pet").style.fontSize=(110+i*14)+"px";
 $("pn").textContent=g[2];$("st").textContent="⭐ "+S.s;
 if(n){$("pb").style.width=((S.s-g[0])/(n[0]-g[0])*100)+"%";$("pt").textContent="باقي "+(n[0]-S.s)+" نجمة ليكبر صديقك"}
 else{$("pb").style.width="100%";$("pt").textContent="وصل صديقك لأكبر حجم! 🎉"}}
function snd(f){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
 f.forEach(function(h,k){var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+k*.12;
 o.type="triangle";o.frequency.value=h;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);
 o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.26)})}catch(e){}}
function say(t){try{var u=new SpeechSynthesisUtterance(t);u.lang="ar-SA";u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function shuf(a){return a.sort(function(){return Math.random()-.5})}
function burst(el){var r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
 for(var i=0;i<14;i++){var s=document.createElement("span");s.className="fl";s.textContent=["⭐","✨","💛","🌟"][i%4];
 s.style.left=x+"px";s.style.top=y+"px";s.style.setProperty("--dx",(Math.random()-.5)*300+"px");s.style.setProperty("--dy",(Math.random()-.8)*260+"px");
 document.body.appendChild(s);(function(e){setTimeout(function(){e.remove()},1150)})(s)}}
function toast(t){var e=$("ts");e.textContent=t;e.classList.add("s");setTimeout(function(){e.classList.remove("s")},2800)}
function start(m){mode=m;rd=0;ok=0;$("home").hidden=true;$("game").hidden=false;snd([523,659]);next()}
function dots(){var h="";for(var i=0;i<5;i++)h+='<i class="'+(i<ok?"on":"")+'"></i>';$("ds").innerHTML=h}
function next(){dots();var o,c,h="";
 if(mode==="L"){var w=W[Math.floor(Math.random()*W.length)];cur=w;c=w[2];
  var ls=shuf(W.map(function(x){return x[2]}).filter(function(l){return l!==c})).slice(0,2);o=shuf([c].concat(ls));
  $("q").textContent="ما هو أول حرف؟";$("pic").textContent=w[0];$("wd").textContent=w[1];setTimeout(function(){say(w[1])},250)}
 else{var n=1+Math.floor(Math.random()*9),f=FR[Math.floor(Math.random()*FR.length)],a=[n];c=n;
  while(a.length<3){var r=1+Math.floor(Math.random()*9);if(a.indexOf(r)<0)a.push(r)}
  o=shuf(a);$("q").textContent="كم عددها؟";$("pic").textContent=new Array(n+1).join(f);$("wd").textContent=""}
 o.forEach(function(v){h+='<button class="opt" data-v="'+v+'">'+(mode==="N"?D[v]:v)+'</button>'});
 $("op").innerHTML=h;$("op").setAttribute("data-c",c)}
$("op").onclick=function(e){var b=e.target.closest(".opt");if(!b)return;
 if(b.getAttribute("data-v")!==$("op").getAttribute("data-c")){b.classList.add("no");snd([220,180]);return}
 b.classList.add("ok");snd([523,659,784]);burst(b);ok++;S.s++;save();dots();
 var pe=$("pet");
 if(ok>=5){setTimeout(finish,900)}else setTimeout(next,900)};
function finish(){var before=ST[stg()][1];$("game").hidden=true;$("home").hidden=false;home();
 var p=$("pet");p.classList.remove("jump");void p.offsetWidth;p.classList.add("jump");burst(p);snd([523,659,784,1046]);
 var after=ST[stg()][1];
 toast(after!==before?"🎉 واو! صديقك كبر وصار "+ST[stg()][2]:"🌟 أحسنت! كسبت ٥ نجوم")}
$("gL").onclick=function(){start("L")};$("gN").onclick=function(){start("N")};
$("bk").onclick=function(){$("game").hidden=true;$("home").hidden=false;home()};
$("pet").onclick=function(){var p=$("pet");p.classList.remove("jump");void p.offsetWidth;p.classList.add("jump");snd([660,880]);burst(p)};
var FAM=[{n:"طائر",e:["🥚","🐣","🐥","🦜","🦚"]},{n:"قط",e:["🥚","🐱","😺","🐈","🦁"]},{n:"ديناصور",e:["🥚","🦎","🐊","🦖","🐉"]},{n:"أرنب",e:["🥚","🐭","🐹","🐰","🦄"]}],
ADJ=["","صغير","ذكي","قوي","أسطوري"],
SH=[["🎀",10],["🎩",10],["🕶️",15],["👑",30]],
C=[["🍎","أحمر"],["🍌","أصفر"],["🥒","أخضر"],["🐋","أزرق"],["🍊","برتقالي"],["🍆","بنفسجي"],["☁️","أبيض"],["🐈‍⬛","أسود"],["🌸","وردي"]];
W=[["🦁","أسد","أ"],["🦆","بطة","ب"],["🍎","تفاحة","ت"],["🦊","ثعلب","ث"],["🐪","جمل","ج"],["🐴","حصان","ح"],["🐑","خروف","خ"],["🐓","ديك","د"],["🌽","ذرة","ذ"],["🪶","ريشة","ر"],["🦒","زرافة","ز"],["🐟","سمكة","س"],["☀️","شمس","ش"],["🚀","صاروخ","ص"],["🐸","ضفدع","ض"],["✈️","طائرة","ط"],["✉️","ظرف","ظ"],["🍇","عنب","ع"],["☁️","غيمة","غ"],["🐘","فيل","ف"],["🐱","قطة","ق"],["🐶","كلب","ك"],["🍋","ليمون","ل"],["🍌","موزة","م"],["⭐","نجمة","ن"],["🌙","هلال","ه"],["🌹","وردة","و"],["✋","يد","ي"]];
function ar(n){return String(n).replace(/\d/g,function(x){return D[x]})}
function setST(){var F=FAM[S.p||0];ST=[0,5,15,30,50].map(function(t,i){return[t,F.e[i],i?ADJ[i]+" "+F.n:"بيضة صغيرة"]})}
function daily(){var d=Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
 if(S.p!=null&&S.d!==d){S.k=S.d===d-1?(S.k||0)+1:1;S.d=d;S.c=(S.c||0)+3;save();setTimeout(function(){toast("🎁 هدية اليوم: ٣ عملات! 🔥 "+ar(S.k)+" أيام متتالية");home()},700)}}
function home(){
 if(S.p==null){$("pick").hidden=false;$("main").hidden=true;
  $("pk").innerHTML=FAM.map(function(f,i){return'<button class="opt" data-p="'+i+'">'+f.e[3]+'<br><small style="font-size:15px">'+f.n+'</small></button>'}).join("");return}
 $("pick").hidden=true;$("main").hidden=false;setST();
 var i=stg(),g=ST[i],n=ST[i+1];
 $("pet").textContent=g[1];$("pet").style.fontSize=(110+i*14)+"px";$("ac").textContent=S.a||"";
 $("pn").textContent=g[2];$("st").textContent="⭐ "+S.s+"  🪙 "+(S.c||0)+"  🔥 "+(S.k||0);
 if(n){$("pb").style.width=((S.s-g[0])/(n[0]-g[0])*100)+"%";$("pt").textContent="باقي "+(n[0]-S.s)+" نجمة ليكبر صديقك"}
 else{$("pb").style.width="100%";$("pt").textContent="وصل صديقك لأكبر حجم! 🎉"}
 var o=S.o||[];
 $("sh").innerHTML=SH.map(function(x,k){var has=o.indexOf(x[0])>-1;return'<button class="opt sm'+(S.a===x[0]?' eq':'')+'" data-i="'+k+'" style="font-size:30px;padding:10px 0">'+x[0]+'<br><small style="font-size:13px">'+(has?(S.a===x[0]?"يلبسها":"ألبسها"):x[1]+"🪙")+'</small></button>'}).join("");
 var t=S.t||{};
 $("pa").innerHTML="إجابات صحيحة:<br>🔤 حروف: "+(t.L||0)+" · 🔢 أرقام: "+(t.N||0)+" · 🎨 ألوان: "+(t.C||0)+" · ➕ حساب: "+(t.M||0)+"<br>⭐ مجموع النجوم: "+S.s+" · 🔥 أيام متتالية: "+(S.k||0)+"<br><small>التقدم محفوظ على هذا الجهاز.</small>"}
$("pk").onclick=function(e){var b=e.target.closest(".opt");if(!b)return;S.p=+b.getAttribute("data-p");setST();save();snd([523,659,784]);daily();home()};
$("sh").onclick=function(e){var b=e.target.closest(".opt");if(!b)return;var x=SH[+b.getAttribute("data-i")];S.o=S.o||[];
 if(S.o.indexOf(x[0])>-1){S.a=S.a===x[0]?"":x[0];snd([660,880])}
 else if((S.c||0)>=x[1]){S.c-=x[1];S.o.push(x[0]);S.a=x[0];snd([523,659,784,1046]);burst(b)}
 else{toast("تحتاج عملات أكثر، العب وأجمعها! 🪙");snd([220])}
 save();home()};
function next(){dots();var h="",c,o,sm=false;
 if(mode==="L"){var w=W[Math.floor(Math.random()*W.length)];c=w[2];
  o=shuf([c].concat(shuf(W.map(function(x){return x[2]}).filter(function(l){return l!==c})).slice(0,2)));
  $("q").textContent="ما هو أول حرف؟";$("pic").textContent=w[0];$("wd").textContent=w[1];setTimeout(function(){say(w[1])},250)}
 else if(mode==="N"){var n=1+Math.floor(Math.random()*9),f=FR[Math.floor(Math.random()*FR.length)],a=[n];c=n;
  while(a.length<3){var r=1+Math.floor(Math.random()*9);if(a.indexOf(r)<0)a.push(r)}
  o=shuf(a);$("q").textContent="كم عددها؟";$("pic").textContent=new Array(n+1).join(f);$("wd").textContent=""}
 else if(mode==="C"){var w=C[Math.floor(Math.random()*C.length)];c=w[1];sm=true;
  o=shuf([c].concat(shuf(C.map(function(x){return x[1]}).filter(function(l){return l!==c})).slice(0,2)));
  $("q").textContent="ما لون هذا؟";$("pic").textContent=w[0];$("wd").textContent="";setTimeout(function(){say("ما لون هذا")},250)}
 else{var m=3+stg()*2,a=1+Math.floor(Math.random()*m),b=1+Math.floor(Math.random()*m),sub=stg()>=2&&Math.random()<.5;
  if(sub&&b>a){var t=a;a=b;b=t}c=sub?a-b:a+b;var A=[c];
  while(A.length<3){var r=Math.max(0,c+Math.floor(Math.random()*7)-3);if(A.indexOf(r)<0)A.push(r)}
  o=shuf(A);$("q").textContent="كم الناتج؟";$("pic").textContent=ar(a)+(sub?" − ":" + ")+ar(b)+" = ؟";$("wd").textContent=""}
 o.forEach(function(v){h+='<button class="opt'+(sm?' sm':'')+'" data-v="'+v+'">'+(mode==="N"||mode==="M"?ar(v):v)+'</button>'});
